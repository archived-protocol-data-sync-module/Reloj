<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reloj</title>

<style>
body{
    background:black;
    color:white;
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial, sans-serif;
}

#clock{
    font-size:80px;
    font-weight:bold;
    text-align:center;
}
</style>

</head>

<body>

<div id="clock"></div>

<script>
function updateClock(){

    let now = new Date();

    let h = now.getHours();
    let m = now.getMinutes();
    let s = now.getSeconds();

    let ampm = h >= 12 ? "PM" : "AM";

    h = h % 12;
    h = h ? h : 12;

    m = m < 10 ? "0"+m : m;
    s = s < 10 ? "0"+s : s;

    document.getElementById("clock").innerHTML =
        h + ":" + m + ":" + s + " " + ampm;
}

setInterval(updateClock,1000);
updateClock();
</script>

</body>
</html>
